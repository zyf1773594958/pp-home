<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>招行黄金实时价格</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a14;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.07);
      --gold: #ffc107;
      --gold-dim: rgba(255,193,7,0.15);
      --green: #4caf50;
      --red: #f44336;
      --text: #e8e8e8;
      --muted: #666;
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      padding: 28px 16px 20px;
      background: linear-gradient(180deg, rgba(255,193,7,0.08) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.3rem; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
    .header .sub { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .live-tag {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 10px; padding: 3px 10px; border-radius: 20px;
      font-size: 0.68rem; background: rgba(255,255,255,0.06); color: #888;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      transition: background 0.3s;
    }
    .live-dot.ok { background: var(--green); animation: blink 1.5s infinite; }
    .live-dot.err { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .container { padding: 0 12px 32px; max-width: 480px; margin: 0 auto; }

    /* ── Price cards ── */
    .price-row {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: 10px; margin-top: 16px;
    }
    .pc {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 8px 14px;
      text-align: center; transition: transform 0.15s;
    }
    .pc:active { transform: scale(0.97); }
    .pc.buy  { border-color: rgba(76,175,80,0.35); }
    .pc.sell { border-color: rgba(244,67,54,0.35); }
    .pc-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
    .pc-val   { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
    .pc.buy .pc-val  { color: var(--green); }
    .pc.sell .pc-val { color: var(--red); }
    .pc-unit { font-size: 0.6rem; color: #444; margin-top: 4px; }

    /* ── Meta row ── */
    .meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding: 10px 14px;
      background: var(--card); border-radius: 12px;
      font-size: 0.72rem; color: #888;
    }
    .meta strong { color: #bbb; font-weight: 500; }
    .spread-chip {
      background: var(--gold-dim); color: var(--gold);
      padding: 2px 8px; border-radius: 8px; font-size: 0.68rem;
    }

    /* ── Chart ── */
    .chart-box {
      margin-top: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .chart-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .chart-title { font-size: 0.85rem; font-weight: 600; color: #ccc; }
    .taps { display: flex; gap: 4px; }
    .tap {
      background: rgba(255,255,255,0.07); border: none; color: #888;
      padding: 5px 10px; border-radius: 8px; font-size: 0.68rem;
      cursor: pointer; transition: all 0.15s;
    }
    .tap.on, .tap:active { background: var(--gold-dim); color: var(--gold); }

    .cwrap { position: relative; height: 200px; }

    /* ── Controls ── */
    .ctrls {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .btn {
      flex: 1; padding: 12px 0; border: none; border-radius: 12px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; }
    .btn-gold { background: linear-gradient(135deg,#ffc107,#ff9800); color: #111; }
    .btn-ghost { background: rgba(255,255,255,0.07); color: #aaa; }

    /* ── Error toast ── */
    .toast {
      margin-top: 10px; padding: 10px 14px; border-radius: 10px;
      font-size: 0.72rem; color: #ef9a9a; background: rgba(244,67,54,0.12);
      border: 1px solid rgba(244,67,54,0.25); display: none;
    }
    .toast.show { display: block; }

    /* ── History ── */
    .hist { margin-top: 14px; }
    .hist-hd { font-size: 0.82rem; font-weight: 600; color: #bbb; margin-bottom: 8px; }
    .hist-list { display: flex; flex-direction: column; gap: 6px; }
    .hist-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: var(--card); border-radius: 10px;
      font-size: 0.72rem;
    }
    .hi-time { color: #666; min-width: 60px; }
    .hi-prices { display: flex; gap: 10px; flex: 1; justify-content: center; }
    .hi-p span { color: #aaa; }
    .hi-p b { color: #e0e0e0; font-weight: 600; }
    .hi-change { min-width: 50px; text-align: right; }
    .up { color: var(--red); }
    .down { color: var(--green); }
    .no-data { text-align: center; color: #444; padding: 24px 0; font-size: 0.78rem; }

    /* ── Footer ── */
    .foot { text-align: center; font-size: 0.62rem; color: #333; margin-top: 20px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🥇 招行黄金实时价格</h1>
  <div class="sub">数据来源：招商银行贵金属交易接口</div>
  <div class="live-tag">
    <div class="live-dot" id="dot"></div>
    <span id="statusTxt">初始化中…</span>
  </div>
  <div class="price-row">
    <div class="pc buy">
      <div class="pc-label">💵 买入价</div>
      <div class="pc-val" id="buyVal">--</div>
      <div class="pc-unit">元/克</div>
    </div>
    <div class="pc sell">
      <div class="pc-label">💸 卖出价</div>
      <div class="pc-val" id="sellVal">--</div>
      <div class="pc-unit">元/克</div>
    </div>
  </div>
  <div class="meta">
    <strong id="updTime">--</strong>
    <span class="spread-chip" id="spreadChip">价差 --</span>
  </div>
</div>

<div class="container">
  <div class="toast" id="toast"></div>

  <div class="chart-box">
    <div class="chart-top">
      <div class="chart-title">📈 买入价走势</div>
      <div class="taps">
        <button class="tap" data-r="30" onclick="setRange(30)">30分</button>
        <button class="tap on" data-r="120" onclick="setRange(120)">2时</button>
        <button class="tap" data-r="360" onclick="setRange(360)">6时</button>
        <button class="tap" data-r="1440" onclick="setRange(1440)">全天</button>
      </div>
    </div>
    <div class="cwrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="ctrls">
    <button class="btn btn-gold" id="refBtn" onclick="fetchPrice()">🔄 刷新</button>
    <button class="btn btn-ghost" id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
    <button class="btn btn-ghost" onclick="exportCSV()">📥 导出</button>
  </div>

  <div class="hist">
    <div class="hist-hd">📋 最近记录</div>
    <div class="hist-list" id="histList"><div class="no-data">暂无数据，正在获取…</div></div>
  </div>

  <div class="foot">数据仅供参考，以招商银行官方报价为准 · 每5秒自动刷新</div>
</div>

<script>
const API = 'https://mbmodule-openapi.paas.cmbchina.com/product/v1/func/market-center';
const HDRS = {
  'Content-Type':'application/x-www-form-urlencoded',
  'Origin':'https://mbmodulecdn.cmbimg.com',
  'Referer':'https://mbmodulecdn.cmbimg.com/',
  'X-Requested-With':'cmb.pb',
  'Accept':'application/json, text/plain, */*',
  'User-Agent':'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36',
};
const BODY = 'params=[{"prdType":"H","prdCode":""}]';

let history  = JSON.parse(localStorage.getItem('gGold') || '[]');
let prevBuy  = null;
let paused   = false;
let ttr      = null;
let chart    = null;
let rangeMin = 120;

// ── Fetch ──
async function fetchPrice() {
  const btn = document.getElementById('refBtn');
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    const r = await fetch(API, { method:'POST', headers:HDRS, body:BODY });
    const j = await r.json();
    if (!j?.data?.FQAMBPRCZ1) throw new Error(j?.msg || '数据格式异常');

    hideToast();
    const d   = j.data.FQAMBPRCZ1;
    const buy = parseFloat(d.zBuyPrc);
    const sel = parseFloat(d.zSelPrc);
    const now = j.data.NowTime || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});

    document.getElementById('buyVal').textContent = buy.toFixed(2);
    document.getElementById('sellVal').textContent = sel.toFixed(2);
    document.getElementById('updTime').textContent = '🕐 ' + now;
    document.getElementById('spreadChip').textContent = '价差 ¥' + (buy - sel).toFixed(2);

    setStatus(true);

    const rec = { time: now, buy, sell: sel, ts: Date.now() };
    history.unshift(rec);
    if (history.length > 600) history.length = 600;
    localStorage.setItem('gGold', JSON.stringify(history));

    renderHist();
    drawChart();

    // flash color on buy price change
    const bv = document.getElementById('buyVal');
    if (prevBuy !== null) {
      const diff = buy - prevBuy;
      bv.style.color = diff >= 0 ? '#f44336' : '#4caf50';
      setTimeout(() => bv.style.color = '', 800);
    }
    prevBuy = buy;

  } catch (e) {
    showToast('请求失败：' + e.message + '（建议开启本地代理）');
    setStatus(false);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 刷新';
  }
}

// ── Chart ──
function initChart() {
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{
      data: [],
      borderColor: '#ffc107',
      backgroundColor: 'rgba(255,193,7,0.1)',
      borderWidth: 2,
      fill: true, tension: 0.35,
      pointRadius: 0,
      pointHitRadius: 16,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10,10,20,0.9)',
          titleColor: '#aaa', bodyColor: '#ffc107',
          callbacks: { label: v => '  买入价 ' + v.parsed.y.toFixed(2) + ' 元/克' }
        }
      },
      scales: {
        x: { ticks:{color:'#444',maxTicksLimit:6,maxRotation:0}, grid:{color:'rgba(255,255,255,0.04)'} },
        y: { ticks:{color:'#444',stepSize:2,callback:v=>Math.round(v)}, grid:{color:'rgba(255,255,255,0.04)'} }
      }
    }
  });
}

function drawChart() {
  const sliced = history
    .filter(h => h.ts >= Date.now() - rangeMin * 60000)
    .sort((a, b) => a.ts - b.ts);
  chart.data.labels   = sliced.map(h => h.time);
  chart.data.datasets[0].data = sliced.map(h => h.buy);
  // 纵轴取整值刻度：按实际波动幅度自动选步长（1/2/5/10...），上下留一格边距
  const vals = sliced.map(h => h.buy);
  if (vals.length) {
    const rawMin = Math.min(...vals);
    const rawMax = Math.max(...vals);
    const span = rawMax - rawMin;
    const step = [1, 2, 5, 10, 20, 50, 100].find(s => span <= s * 5) || 100;
    let lo = Math.floor((rawMin - step) / step) * step;
    let hi = Math.ceil((rawMax + step) / step) * step;
    if (hi <= lo) hi = lo + step;
    chart.options.scales.y.min = lo;
    chart.options.scales.y.max = hi;
    chart.options.scales.y.ticks.stepSize = step;
    chart.options.scales.y.ticks.callback = v => Math.round(v);
  }
  chart.update();
}

function setRange(m) {
  rangeMin = m;
  document.querySelectorAll('.tap').forEach(b =>
    b.classList.toggle('on', parseInt(b.dataset.r) === m));
  drawChart();
}

// ── History ──
function renderHist() {
  const el = document.getElementById('histList');
  const rows = history.slice(0, 20);
  el.innerHTML = rows.map((r, i) => {
    const prev = i < rows.length - 1 ? rows[i + 1].buy : null;
    let chg = '';
    if (prev !== null) {
      const d = r.buy - prev;
      chg = `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'}${Math.abs(d).toFixed(2)}</span>`;
    }
    return `<div class="hist-item">
      <span class="hi-time">${r.time}</span>
      <div class="hi-prices">
        <span class="hi-p" style="color:#4caf50">买<b>${r.buy.toFixed(2)}</b></span>
        <span class="hi-p" style="color:#f44336">卖<b>${r.sell.toFixed(2)}</b></span>
      </div>
      <div class="hi-change">${chg||'—'}</div>
    </div>`;
  }).join('');
}

// ── Controls ──
function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  if (paused) { clearInterval(ttr); btn.textContent = '▶ 恢复'; }
  else { startTimer(); btn.textContent = '⏸ 暂停'; }
}

function startTimer() {
  clearInterval(ttr);
  ttr = setInterval(fetchPrice, 5000);
}

function exportCSV() {
  if (!history.length) { showToast('暂无数据'); return; }
  const csv = ['时间,买入价,卖出价\n',
    ...history.map(h => `${h.time},${h.buy.toFixed(2)},${h.sell.toFixed(2)}`)
  ].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv'}));
  a.download = `黄金价格_${new Date().toLocaleDateString('zh-CN')}.csv`;
  a.click();
}

function setStatus(ok) {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('statusTxt');
  dot.className = 'live-dot ' + (ok ? 'ok' : 'err');
  txt.textContent = ok ? '实时更新中' : '连接异常';
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('show');
  setTimeout(hideToast, 4000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

// ── Init ──
initChart();
renderHist();
fetchPrice();
startTimer();
</script>
</body>
</html>
